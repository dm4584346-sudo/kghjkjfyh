
name: DOTA PRO LAB - iOS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Select iOS build type"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: dota-pro-lab-ios-build
  cancel-in-progress: false

jobs:
  ios-build:
    name: Verify and Build IPA
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Expo dependency validation
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/dota-pro-lab-export

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --force --non-interactive

      - name: Build iOS application
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait
